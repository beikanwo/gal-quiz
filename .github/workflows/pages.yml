# 把 site/ 文件夹发布到 GitHub Pages。推送到 main 时自动运行，也可以在 Actions 页面手动运行。
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'The exact validated collection commit to deploy'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Notify Bing via IndexNow after a successful deployment
        continue-on-error: true
        run: node scripts/discovery/submit-indexnow.mjs
